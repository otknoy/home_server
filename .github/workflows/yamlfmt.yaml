name: yamlfmt

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify-lockfile:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.0
      - name: Verify actions lockfile
        run: gh actions-lock --verify
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: 'stable'
          cache: false
      - name: Install yamlfmt
        run: go install github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0
      - name: Lint YAML
        run: '"$(go env GOPATH)/bin/yamlfmt" -lint .'
