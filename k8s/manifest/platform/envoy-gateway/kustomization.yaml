apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ./upstream/install.yaml

patches:
  # The static release YAML contains Helm hooks. Keep these as ordinary Argo CD resources.
  - target:
      annotationSelector: helm.sh/hook
    patch: |-
      - op: remove
        path: /metadata/annotations/helm.sh~1hook
  - target:
      annotationSelector: helm.sh/hook-weight
    patch: |-
      - op: remove
        path: /metadata/annotations/helm.sh~1hook-weight
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: placeholder.example.com
        annotations:
          argocd.argoproj.io/sync-options: ServerSideApply=true
  - target:
      group: batch
      version: v1
      kind: Job
      name: eg-gateway-helm-certgen
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: Force=true,Replace=true
      - op: remove
        path: /spec/ttlSecondsAfterFinished
