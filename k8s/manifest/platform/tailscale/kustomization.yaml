apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

images:
  - name: tailscale/k8s-operator
    newTag: v1.104.7
  - name: tailscale/tailscale
    newTag: v1.104.4

configurations:
  - ./image-transformer-config.yaml

resources:
  - ./upstream/operator.yaml
  - ./secrets
  - ./api-server-proxy-rbac.yaml
  - ./admin-rolebinding.yaml

patches:
  - path: ./remove-operator-oauth-secret.yaml
  - path: ./api-server-proxy-patch.yaml
