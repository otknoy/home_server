apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/otknoy/home_server
    targetRevision: HEAD
    path: k8s/manifest/base
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: false
