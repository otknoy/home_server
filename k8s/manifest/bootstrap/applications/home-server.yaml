apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/otknoy/home_server
    targetRevision: HEAD
    path: k8s/manifest/base
  destination:
    server: https://kubernetes.default.svc
  ignoreDifferences:
    - group: ""
      kind: Service
      name: debian
      namespace: monitoring
      jsonPointers:
        - /spec/externalName
    - group: ""
      kind: Service
      name: ds224plus
      namespace: monitoring
      jsonPointers:
        - /spec/externalName
  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: false
