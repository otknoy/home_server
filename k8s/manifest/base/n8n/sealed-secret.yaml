apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: n8n-secret
  namespace: n8n
spec:
  encryptedData:
    DB_POSTGRESDB_PASSWORD: 
    DB_POSTGRESDB_USER: 
    N8N_BASIC_AUTH_PASSWORD: 
    N8N_BASIC_AUTH_USER: 
    N8N_ENCRYPTION_KEY: 
  template:
    metadata:
      name: n8n-secret
      namespace: n8n

---

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-secret
  namespace: n8n
spec:
  encryptedData:
    POSTGRES_DB: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      name: postgres-secret
      namespace: n8n
