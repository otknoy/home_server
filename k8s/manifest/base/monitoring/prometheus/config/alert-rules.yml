groups:

  - name: argocd
    rules:
      - alert: ArgoCDMetricsUnavailable
        expr: up{service="argocd-metrics", namespace="argocd"} == 0 or absent(up{service="argocd-metrics", namespace="argocd"})
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "Argo CD metrics are unavailable"
      - alert: ArgoCDSyncFailed
        expr: sum by (name, exported_namespace) (increase(argocd_app_sync_total{service="argocd-metrics", phase=~"Failed|Error"}[15m])) > 0
        labels:
          severity: warn
        annotations:
          summary: "Argo CD sync failed: {{ $labels.name }}"
          description: "A sync failed or errored within the last 15 minutes. Check the latest operation in Argo CD."
      - alert: ArgoCDAppOutOfSync
        expr: argocd_app_info{service="argocd-metrics", sync_status!="Synced"} == 1
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "Argo CD application is not synced: {{ $labels.name }}"
          description: "An application has not been Synced for 15 minutes. Check Argo CD and sync manually if needed."
      - alert: ArgoCDAppUnhealthy
        expr: argocd_app_info{service="argocd-metrics", health_status!="Healthy"} == 1
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "Argo CD application is unhealthy: {{ $labels.name }}"
          description: "Application health has been {{ $labels.health_status }} for 15 minutes."

  - name: sample
    rules:
      - alert: NodeInstanceDown
        expr: up{job='node'} == 0
        for: 30s

  - name: room
    rules:
      - alert: low templature
        expr: roomctl_temperature < 10
        labels:
          severity: warn
        annotations:
          summary: "Low tempature: {{ humanize $value }}℃"
      - alert: high templature
        expr: roomctl_temperature > 30
        labels:
          severity: warn
        annotations:
          summary: "High tempature: {{ humanize $value }}℃"
      - alert: low humidity
        expr: roomctl_humidity < 30
        labels:
          severity: warn
        annotations:
          summary: "Low humidiry: {{ humanize $value }}%"
      - alert: high humidity
        expr: roomctl_humidity > 70
        labels:
          severity: warn
        annotations:
          summary: "High Humidity: {{ humanize $value }}%"

  - name: debian
    rules:
      - alert: disk usage
        expr: |
          100 * (1 - (node_filesystem_avail_bytes{job="node-exporter"} / node_filesystem_size_bytes{job="node-exporter"})) >= 85
        labels:
          severity: warn
        annotations:
          summary: "disk usage too high: {{ humanize $value }}%"
      - alert: disk unmounted
        expr: |
          count(node_disk_info{job="debian"}) < 3
        labels:
          severity: warn
        annotations:
          summary: "disk is unmounted"
