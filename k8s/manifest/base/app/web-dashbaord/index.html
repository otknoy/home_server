<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090911">
    <title>Home Server Dashboard</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #090911;
        --panel: #11111d;
        --text: #f5f3ff;
        --muted: #aaa9c0;
        --cyan: #68fff1;
        --pink: #ff73c7;
        font-family: system-ui, sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        color: var(--text);
        background:
          linear-gradient(#aaa9ff0b 1px, transparent 1px) 0 0 / 32px 32px,
          linear-gradient(90deg, #aaa9ff0b 1px, transparent 1px) 0 0 / 32px 32px,
          radial-gradient(ellipse at top right, #331432, transparent 55%),
          var(--background);
        min-height: 100vh;
      }

      main {
        width: min(72rem, calc(100% - 2rem));
        margin-inline: auto;
        padding-block: clamp(2rem, 8vw, 6rem);
      }

      header {
        position: relative;
        overflow: hidden;
        isolation: isolate;
        padding: clamp(1.25rem, 5vw, 3.5rem);
        border: 1px solid #483456;
        border-top: 3px solid var(--cyan);
        background: linear-gradient(110deg, #131321 42%, #29172d);
        box-shadow: 0 0 2rem #68fff114;
      }

      header::before {
        content: "";
        position: absolute;
        z-index: -1;
        inset: 0 0 0 50%;
        background: repeating-linear-gradient(135deg, transparent 0 13px, #ff73c738 14px 15px);
        mask-image: linear-gradient(90deg, transparent, black);
      }

      header::after {
        content: "";
        position: absolute;
        right: 0;
        bottom: 0;
        width: 4rem;
        height: .4rem;
        background: var(--pink);
      }

      h1, h2, .service-name, .arrow {
        font-family: ui-monospace, "Cascadia Code", "Courier New", monospace;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 6.5rem);
        line-height: .95;
        letter-spacing: -.075em;
        text-transform: uppercase;
      }

      h1 span {
        display: block;
        color: var(--cyan);
        text-shadow: 0 0 1.5rem #68fff15c;
      }

      section {
        --accent: var(--cyan);
        margin-top: 2.5rem;
      }

      section.operations { --accent: var(--pink); }

      h2 {
        display: flex;
        align-items: center;
        gap: .85rem;
        margin: 0 0 .9rem;
        color: var(--accent);
        font-size: 1rem;
        letter-spacing: .07em;
      }

      h2::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, var(--accent), transparent);
      }

      ul {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 14rem), 1fr));
        gap: .8rem;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      li { display: flex; }

      a {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas: "name arrow" "description arrow";
        align-content: center;
        gap: .35rem .75rem;
        width: 100%;
        min-height: 6rem;
        padding: 1rem 1.1rem;
        border: 1px solid #3a344d;
        border-left: 3px solid var(--accent);
        background: var(--panel);
        color: var(--text);
        text-decoration: none;
        transition: background-color .15s, border-color .15s, box-shadow .15s;
      }

      a:hover, a:focus-visible {
        border-color: var(--accent);
        background: #1d192b;
        box-shadow: 0 0 1.1rem color-mix(in srgb, var(--accent) 24%, transparent);
      }

      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .service-name {
        grid-area: name;
        font-size: 1.1rem;
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .description {
        grid-area: description;
        color: var(--muted);
        font-size: .85rem;
      }

      .arrow {
        grid-area: arrow;
        align-self: center;
        color: var(--accent);
        font-size: 1.35rem;
      }

      @media (prefers-reduced-motion: reduce) {
        a { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Home Server <span>Dashboard</span></h1>
      </header>

      <nav aria-label="サービス">
        <section aria-labelledby="monitoring">
          <h2 id="monitoring">モニタリング</h2>
          <ul>
            <li>
              <a href="/grafana">
                <span class="service-name">Grafana</span>
                <span class="description">メトリクスの可視化</span>
                <span class="arrow" aria-hidden="true">→</span>
              </a>
            </li>
            <li>
              <a href="/prometheus">
                <span class="service-name">Prometheus</span>
                <span class="description">メトリクスの収集・検索</span>
                <span class="arrow" aria-hidden="true">→</span>
              </a>
            </li>
            <li>
              <a href="/alertmanager/">
                <span class="service-name">Alertmanager</span>
                <span class="description">アラート管理</span>
                <span class="arrow" aria-hidden="true">→</span>
              </a>
            </li>
            <li>
              <a href="/pushgateway">
                <span class="service-name">Pushgateway</span>
                <span class="description">バッチジョブのメトリクス</span>
                <span class="arrow" aria-hidden="true">→</span>
              </a>
            </li>
          </ul>
        </section>

        <section class="operations" aria-labelledby="operations">
          <h2 id="operations">運用ツール</h2>
          <ul>
            <li>
              <a href="https://argocd.tailba37e.ts.net/">
                <span class="service-name">Argo CD</span>
                <span class="description">デプロイと同期状況</span>
                <span class="arrow" aria-hidden="true">↗</span>
              </a>
            </li>
            <li>
              <a href="https://my-registry.tailba37e.ts.net/">
                <span class="service-name">my-registry</span>
                <span class="description">コンテナイメージ</span>
                <span class="arrow" aria-hidden="true">↗</span>
              </a>
            </li>
            <li>
              <a href="https://n8n.tailba37e.ts.net/">
                <span class="service-name">n8n</span>
                <span class="description">ワークフローの自動化</span>
                <span class="arrow" aria-hidden="true">↗</span>
              </a>
            </li>
          </ul>
        </section>
      </nav>
    </main>
  </body>
</html>
